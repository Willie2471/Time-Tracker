<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WS Lawn Care — Time Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   BASE
══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: transparent;
  color: #111827;
  overflow-x: hidden;
}

/* PAGE LAYOUT */
.page-wrap { display: flex; flex-direction: column; align-items: center; padding: 12px 16px; }
/* ══════════════════════════════════════
   WIDGET SECTION
══════════════════════════════════════ */
.widget-section {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 0;
  position: relative;
  z-index: 20;
}

#widget {
  position: relative;
  width: 380px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.10), 0 0 0 1px rgba(74,222,128,0.10);
  overflow: hidden;
  user-select: none;
  cursor: default;
  transition: box-shadow 0.2s;
}
#widget:hover {
  box-shadow: 0 12px 48px rgba(0,0,0,0.13), 0 0 0 1px rgba(74,222,128,0.18);
}

/* ── Widget Header ── */
.widget-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 12px;
  background: #f0fdf4;
  border-bottom: 1px solid #d1fae5;
  cursor: grab;
}
.widget-header:active { cursor: grabbing; }
.header-left { display: flex; align-items: center; gap: 8px; }
.logo-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #16a34a; box-shadow: 0 0 8px rgba(22,163,74,0.5);
}
.logo-text {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  font-weight: 600; letter-spacing: 0.12em; color: #15803d; text-transform: uppercase;
}
.header-countdown {
  display: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;
  color: #15803d; background: #dcfce7; border: 1px solid #86efac;
  border-radius: 999px; padding: 1px 8px;
}
.header-countdown.show { display: inline-block; }
.header-countdown.warn { color: #b45309; background: #fef3c7; border-color: #fcd34d; animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.55; } }
.header-controls { display: flex; gap: 6px; }
.ctrl-btn {
  width: 26px; height: 26px; border: none; border-radius: 6px;
  background: #e2e8f0; color: #6b7280; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.ctrl-btn:hover { background: #cbd5e1; color: #111827; }

/* ── Timer Bar ── */
.timer-bar {
  position: relative;
  padding: 12px 16px;
  background: rgba(74,222,128,0.07);
  border-bottom: 1px solid #bbf7d0;
  display: flex; align-items: center; gap: 12px;
}
.timer-bar.idle { background: #f9fafb; border-bottom-color: #e5e7eb; }
.timer-info { flex: 1; min-width: 0; }
.timer-sub { font-size: 10.5px; color: #6b7280; font-family: 'IBM Plex Mono', monospace; margin-top: 1px; }
.timer-sub:empty { display: none; }
.budget-track { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(0,0,0,0.06); display: none; }
.timer-bar.has-block .budget-track { display: block; }
.budget-fill { height: 100%; width: 0; background: #16a34a; transition: width 1s linear, background 0.3s; }
.timer-bar.warn { background: #fffbeb; border-bottom-color: #fde68a; }
.timer-bar.warn .timer-display { color: #d97706; animation: blink 1s ease-in-out infinite; }
.timer-bar.warn .timer-sub { color: #b45309; font-weight: 600; }
.timer-bar.warn .budget-fill { background: #f59e0b; }
.timer-project-name {
  flex: 1; font-size: 13px; font-weight: 500; color: #111827;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.timer-project-name.idle-text { color: #9ca3af; font-style: italic; }
.timer-display {
  font-family: 'IBM Plex Mono', monospace; font-size: 15px;
  font-weight: 600; color: #16a34a; min-width: 60px; text-align: right;
}
.timer-display.idle { color: #9ca3af; }
.play-stop-btn {
  width: 30px; height: 30px; border: none; border-radius: 8px;
  background: #16a34a; color: #fff; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s; flex-shrink: 0;
}
.play-stop-btn:hover { background: #15803d; transform: scale(1.05); }
.play-stop-btn.running { background: #f87171; }
.play-stop-btn.running:hover { background: #ef4444; }

/* ── Search ── */
.search-wrap {
  padding: 10px 14px; border-bottom: 1px solid #e5e7eb;
  display: flex; align-items: center; gap: 8px; background: #fff;
}
.search-icon { color: #9ca3af; font-size: 13px; flex-shrink: 0; }
.search-input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;
  color: #111827; caret-color: #16a34a;
}
.search-input::placeholder { color: #9ca3af; }

/* ── Project List ── */
.project-list {
  max-height: 220px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: #d1d5db transparent; background: #fff;
}
.project-list::-webkit-scrollbar { width: 4px; }
.project-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

.empty-state {
  padding: 24px 16px; text-align: center; color: #9ca3af;
  font-size: 13px; line-height: 1.6;
}
.empty-state .empty-icon { display: block; font-size: 24px; margin-bottom: 6px; }

.project-item {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  cursor: pointer; border-left: 2px solid transparent;
  border-bottom: 1px solid #f3f4f6;
  transition: background 0.12s, border-color 0.12s;
}
.project-item:last-child { border-bottom: none; }
.project-item:hover { background: #f0fdf4; border-left-color: #86efac; }
.project-item.active-project { background: #f0fdf4; border-left-color: #16a34a; }
.project-icon {
  width: 28px; height: 28px; border-radius: 7px; background: #f1f5f9;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0;
}
.project-item.active-project .project-icon { background: #dcfce7; }
.project-meta { flex: 1; min-width: 0; }
.project-title {
  font-size: 13px; font-weight: 500; color: #1f2937;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.project-item.active-project .project-title { color: #15803d; }
.project-sub { font-size: 11px; color: #9ca3af; font-family: 'IBM Plex Mono', monospace; margin-top: 1px; }
.project-time { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6b7280; flex-shrink: 0; min-width: 36px; text-align: right; }
.block-chip {
  display: inline-block; max-width: 100%; border: none; background: none; padding: 0; margin-top: 1px;
  cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7280;
  text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.block-chip:hover { text-decoration: underline; }
.block-chip.ok    { color: #15803d; }
.block-chip.low   { color: #b45309; font-weight: 600; }
.block-chip.over  { color: #dc2626; font-weight: 600; }
.block-chip.unset { color: #b45309; }
.row-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.row-bar-fill { height: 100%; width: 0; background: #86efac; transition: width 1s linear; }
.project-item.active-project .row-bar-fill { background: #16a34a; }
.project-item[data-state="low"]  .row-bar-fill { background: #f59e0b; }
.project-item[data-state="over"] .row-bar-fill { background: #ef4444; }
.project-item[data-state="unset"] .row-bar { display: none; }
.delete-btn {
  width: 22px; height: 22px; border: 1px solid #e5e7eb; border-radius: 5px;
  background: #fff; color: #9ca3af; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.delete-btn:hover { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }

/* ── Add Project ── */
.add-project-row {
  padding: 8px 14px; display: flex; align-items: center; gap: 8px;
  border-top: 1px solid #e5e7eb; background: #fff;
}
.add-input {
  flex: 1; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 7px;
  padding: 6px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px;
  color: #111827; outline: none; caret-color: #16a34a; transition: border-color 0.15s, background 0.15s;
}
.add-input { min-width: 0; }
.add-input:focus { border-color: #86efac; background: #fff; }
.add-select {
  width: 92px; flex-shrink: 0; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 7px;
  padding: 6px 4px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #111827;
  outline: none; cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.add-select:focus { border-color: #86efac; background: #fff; }
.add-select.empty { color: #9ca3af; }
.add-input::placeholder { color: #9ca3af; }
.add-btn {
  padding: 6px 12px; background: #f0fdf4; border: 1px solid #86efac;
  border-radius: 7px; color: #15803d; font-size: 12px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background 0.15s;
}
.add-btn:hover { background: #dcfce7; }

/* ── Filter Tabs ── */
.filter-tabs {
  display: flex; gap: 4px; padding: 10px 14px;
  border-top: 1px solid #e5e7eb; background: #f8fafc;
}
.tab {
  flex: 1; padding: 5px 0; text-align: center; font-size: 10px;
  font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: #9ca3af; border-radius: 5px; cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.tab.active { background: #dcfce7; color: #15803d; }
.tab:hover:not(.active) { color: #6b7280; background: #f1f5f9; }

/* ── Summary Panel ── */
.summary-panel { padding: 12px 14px 14px; background: #f8fafc; border-top: 1px solid #e5e7eb; }
.summary-header { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9ca3af; margin-bottom: 10px; }
.summary-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 5px 0; border-bottom: 1px solid #f3f4f6;
}
.summary-row:last-child { border-bottom: none; }
.summary-project { font-size: 12px; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.summary-hrs { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6b7280; }
.summary-total-row {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 8px; margin-top: 4px; border-top: 1px solid #bbf7d0;
}
.summary-total-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.08em; }
.summary-total-val { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: #15803d; }

/* ── Widget Footer ── */
.widget-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; background: #f1f5f9; border-top: 1px solid #e5e7eb;
}
.footer-label { font-size: 10px; color: #9ca3af; font-family: 'IBM Plex Mono', monospace; }
.export-btn {
  background: none; border: 1px solid #d1d5db; border-radius: 5px;
  padding: 3px 8px; font-size: 10px; color: #6b7280; cursor: pointer;
  font-family: 'IBM Plex Sans', sans-serif; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.export-btn:hover { border-color: #86efac; color: #15803d; }
.export-btn.syncing { border-color: #fbbf24; color: #d97706; cursor: wait; }
.export-btn.synced  { border-color: #86efac; color: #15803d; background: #f0fdf4; }
.export-btn.error   { border-color: #fca5a5; color: #ef4444; }

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #fff; border: 1px solid #86efac; color: #15803d;
  font-size: 12px; font-family: 'IBM Plex Mono', monospace;
  padding: 8px 16px; border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  z-index: 99; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ══════════════════════════════════════
   TIME BLOCK PROMPT
══════════════════════════════════════ */
.block-overlay {
  position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
  padding: 16px; background: rgba(255,255,255,0.9); backdrop-filter: blur(3px);
}
.block-overlay.show { display: flex; }
.block-card {
  width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
  padding: 18px 16px 16px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.block-emoji { font-size: 28px; line-height: 1; margin-bottom: 6px; }
.block-title { font-size: 16px; font-weight: 600; color: #111827; }
.block-text { font-size: 12.5px; color: #4b5563; line-height: 1.5; margin: 6px 0 14px; }
.block-actions { display: flex; gap: 8px; margin-bottom: 8px; }
.block-btn {
  flex: 1; padding: 9px 6px; border: 1px solid #16a34a; background: #16a34a; color: #fff;
  border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: background 0.15s;
}
.block-btn:hover { background: #15803d; }
.block-btn.ghost { background: #fff; color: #4b5563; border-color: #d1d5db; width: 100%; }
.block-btn.ghost:hover { background: #f9fafb; }
.block-actions .block-btn.ghost { width: auto; }
.block-select {
  width: 100%; margin-bottom: 10px; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px;
  font-size: 13px; font-family: inherit; color: #111827; background: #fff;
}

/* ══════════════════════════════════════
   DAY PLAN
══════════════════════════════════════ */
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none !important; }
.next-strip {
  display: none; align-items: center; gap: 8px; padding: 7px 14px;
  background: #eff6ff; border-bottom: 1px solid #bfdbfe; font-size: 12px; color: #1e3a8a;
}
.next-strip.show { display: flex; }
.next-strip.due { background: #fef3c7; border-bottom-color: #fde68a; color: #78350f; }
.next-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next-go {
  flex-shrink: 0; padding: 4px 10px; border: none; border-radius: 6px; background: #16a34a; color: #fff;
  font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.next-go:hover { background: #15803d; }

.view-tabs { display: flex; gap: 4px; padding: 8px 14px 0; background: #fff; border-bottom: 1px solid #e5e7eb; }
.vtab {
  flex: 1; padding: 7px 0; border: none; border-bottom: 2px solid transparent; background: none;
  font-family: inherit; font-size: 12px; font-weight: 600; color: #9ca3af; cursor: pointer;
}
.vtab:hover { color: #6b7280; }
.vtab.active { color: #15803d; border-bottom-color: #16a34a; }

.plan-toolbar { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e5e7eb; }
.plan-today-btn {
  padding: 4px 11px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff;
  font-family: inherit; font-size: 11.5px; font-weight: 600; color: #374151; cursor: pointer; margin-right: 4px;
}
.plan-today-btn:hover { background: #f9fafb; }
.plan-nav {
  width: 26px; height: 26px; border: none; border-radius: 50%; background: none; cursor: pointer;
  font-size: 16px; line-height: 1; color: #4b5563;
}
.plan-nav:hover { background: #f1f5f9; }
.plan-date { font-size: 12.5px; font-weight: 600; color: #111827; margin-left: 6px; white-space: nowrap; }

.plan-tray-wrap { padding: 8px 12px 6px; background: #f8fafc; border-bottom: 1px solid #e5e7eb; }
.plan-hint { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: #6b7280; margin-bottom: 6px; }
.plan-hint #planTotal { font-family: 'IBM Plex Mono', monospace; color: #15803d; font-weight: 600; white-space: nowrap; }
.plan-tray { display: flex; flex-wrap: wrap; gap: 5px; max-height: 76px; overflow-y: auto; scrollbar-width: thin; }
.plan-empty { font-size: 11.5px; color: #9ca3af; padding: 4px 0; }
.plan-chip {
  display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 4px 8px 4px 7px;
  border-radius: 7px; background: #fff; border: 1px solid #e5e7eb; border-left: 3px solid var(--c, #16a34a);
  font-size: 11.5px; color: #111827; cursor: grab; touch-action: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.plan-chip:hover { border-color: var(--c, #16a34a); background: #f0fdf4; }
.pc-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pc-left { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6b7280; }

.plan-scroll { position: relative; height: 320px; overflow-y: auto; background: #fff; scrollbar-width: thin; scrollbar-color: #d1d5db transparent; }
.plan-grid { position: relative; }
#planBg { position: absolute; inset: 0; }
.plan-hline { position: absolute; left: 46px; right: 0; border-top: 1px solid #e5e7eb; }
.plan-half  { position: absolute; left: 46px; right: 0; border-top: 1px dotted #eef0f3; }
.plan-hlabel { position: absolute; left: 0; width: 40px; text-align: right; font-size: 9.5px; color: #9ca3af; transform: translateY(-50%); font-family: 'IBM Plex Mono', monospace; }
.plan-entries { position: absolute; top: 0; bottom: 0; left: 52px; right: 8px; }
#planNow { position: absolute; left: 0; right: 0; height: 0; z-index: 5; pointer-events: none; display: none; }
.now-line { position: absolute; left: 46px; right: 0; border-top: 2px solid #ea4335; }
.now-dot  { position: absolute; left: 41px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #ea4335; }
.now-pill {
  position: absolute; left: 0; top: -7px; width: 40px; text-align: center; font-size: 9px; font-weight: 700;
  background: #ea4335; color: #fff; border-radius: 8px; padding: 1px 0; font-family: 'IBM Plex Mono', monospace;
}

.plan-entry {
  position: absolute; left: 0; right: 0; display: flex; align-items: flex-start; gap: 4px; overflow: hidden;
  padding: 2px 4px 2px 6px; border-radius: 6px; border-left: 3px solid var(--c, #16a34a); background: var(--bg, #dcfce7);
  font-size: 11px; line-height: 13px; color: #111827; cursor: grab; touch-action: none; z-index: 2;
  box-shadow: 0 1px 2px rgba(0,0,0,0.10);
}
.plan-entry.dragging { z-index: 6; cursor: grabbing; box-shadow: 0 6px 16px rgba(0,0,0,0.22); }
.plan-entry.tiny { padding: 0 4px 0 6px; align-items: center; }
.plan-entry.tiny .pe-time { display: none; }
.plan-entry.done { opacity: 0.55; }
.plan-entry.done .pe-name { text-decoration: line-through; }
.plan-entry.active { box-shadow: 0 0 0 2px var(--c, #16a34a), 0 3px 10px rgba(0,0,0,0.18); }
.pe-main { flex: 1; min-width: 0; }
.pe-name { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pe-time { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #4b5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan-entry.active .pe-time { color: #15803d; font-weight: 600; }
.pe-actions { display: flex; gap: 2px; flex-shrink: 0; align-items: center; }
.pe-btn {
  width: 16px; height: 16px; padding: 0; border: none; border-radius: 4px; background: rgba(255,255,255,0.75);
  font-size: 8px; color: #374151; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.pe-btn:hover { background: #fff; color: #111827; }
.pe-check { font-size: 11px; color: #15803d; font-weight: 700; padding: 0 2px; }
.pe-handle { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; cursor: ns-resize; touch-action: none; }
.pe-handle::after { content: ''; display: block; width: 18px; height: 2px; border-radius: 1px; background: rgba(0,0,0,0.25); margin: 3px auto 0; }
.plan-entry.tiny .pe-handle { height: 4px; }
.plan-entry.tiny .pe-handle::after { margin-top: 1px; }
.plan-preview {
  position: absolute; left: 0; right: 0; display: none; border: 2px dashed #16a34a; background: rgba(22,163,74,0.12);
  border-radius: 6px; pointer-events: none; z-index: 4;
}
.plan-ghost {
  position: fixed; z-index: 200; pointer-events: none; padding: 5px 10px; border-radius: 8px; background: #fff;
  border: 1px solid #16a34a; box-shadow: 0 6px 18px rgba(0,0,0,0.2); font-size: 12px; color: #111827; white-space: nowrap;
}

</style>
</head>
<body>

<div class="page-wrap">

  <!-- ══ WIDGET ══ -->
  <div class="widget-section">
    <div id="widget">
      <div class="widget-header" id="dragBar">
        <div class="header-left">
          <div class="logo-dot" id="pulseDot"></div>
          <span class="logo-text">WS Time Tracker</span>
          <span class="header-countdown" id="headerCountdown"></span>
        </div>
        <div class="header-controls">
          <button class="ctrl-btn" id="soundBtn" title="Alert sound on" onclick="toggleSound()">🔔</button>
          <button class="ctrl-btn" id="minimizeBtn" title="Minimize/Expand" onclick="toggleMinimize()">─</button>
        </div>
      </div>

      <div id="mainBody">
        <div class="timer-bar idle" id="timerBar">
          <div class="project-icon" id="timerIcon">⏸</div>
          <div class="timer-info">
            <div class="timer-project-name idle-text" id="timerProjectName">No active timer</div>
            <div class="timer-sub" id="timerSub"></div>
          </div>
          <div class="timer-display idle" id="timerDisplay">00:00</div>
          <button class="play-stop-btn" id="playStopBtn" onclick="toggleTimer()">▶</button>
          <div class="budget-track"><div class="budget-fill" id="budgetFill"></div></div>
        </div>

        <!-- Up next: shown in both tabs so the next planned block is always in view -->
        <div class="next-strip" id="nextStrip">
          <span class="next-text" id="nextText"></span>
          <button class="next-go" id="nextGo" onclick="startEntry(this.dataset.id)">▶ Start</button>
        </div>

        <div class="view-tabs">
          <button class="vtab active" id="vtabProjects" onclick="setView('projects')">Projects</button>
          <button class="vtab" id="vtabPlan" onclick="setView('plan')">📅 Day Plan</button>
        </div>

        <div id="viewProjects">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search-input" id="searchInput" placeholder="Search projects…" oninput="filterProjects()">
        </div>

        <div class="project-list" id="projectList"></div>

        <div class="add-project-row">
          <input class="add-input" id="newProjectInput" placeholder="New project name…" onkeydown="if(event.key==='Enter')addProject()">
          <select class="add-select empty" id="newProjectMinutes" title="Time you agree to spend on this project" aria-label="Time block" onchange="this.classList.toggle('empty', !this.value)"></select>
          <button class="add-btn" onclick="addProject()">+ Add</button>
        </div>

        <div class="filter-tabs">
          <div class="tab active" onclick="setFilter('day',this)">Day</div>
          <div class="tab" onclick="setFilter('week',this)">Week</div>
          <div class="tab" onclick="setFilter('month',this)">Month</div>
          <div class="tab" onclick="setFilter('year',this)">Year</div>
        </div>

        <div class="summary-panel">
          <div class="summary-header" id="summaryHeader">Today's Summary</div>
          <div class="summary-rows" id="summaryRows"></div>
          <div class="summary-total-row">
            <span class="summary-total-label">Total</span>
            <span class="summary-total-val" id="summaryTotal">0h 00m</span>
          </div>
        </div>

        </div><!-- end viewProjects -->

        <div id="viewPlan" style="display:none">
          <div class="plan-toolbar">
            <button class="plan-today-btn" id="planTodayBtn" onclick="planGoToday()">Today</button>
            <button class="plan-nav" onclick="planShift(-1)" aria-label="Previous day" title="Previous day">‹</button>
            <button class="plan-nav" onclick="planShift(1)" aria-label="Next day" title="Next day">›</button>
            <span class="plan-date" id="planDateLabel"></span>
          </div>
          <div class="plan-tray-wrap">
            <div class="plan-hint"><span>Drag a project onto the day (or tap it)</span><span id="planTotal"></span></div>
            <div class="plan-tray" id="planTray"></div>
          </div>
          <div class="plan-scroll" id="planScroll">
            <div class="plan-grid" id="planGrid">
              <div id="planBg"></div>
              <div class="plan-entries" id="planEntries"></div>
              <div id="planNow"><span class="now-pill"></span><span class="now-dot"></span><div class="now-line"></div></div>
            </div>
          </div>
        </div>

        <div class="widget-footer">
          <span class="footer-label" id="footerDate"></span>
          <button class="export-btn" id="syncBtn" onclick="syncToSheets()">↑ Sync to Sheets</button>
        </div>
      </div>

      <!-- Time block prompt (time's up / edit block) -->
      <div class="block-overlay" id="blockOverlay" role="dialog" aria-modal="true" aria-labelledby="blockTitle">
        <div class="block-card">
          <div class="block-emoji" id="blockEmoji">⏰</div>
          <div class="block-title" id="blockTitle"></div>
          <div class="block-text" id="blockText"></div>
          <div id="blockBody"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ══ STATE ══
const STORAGE_KEY = 'ws_time_tracker_v2';
const SHEETS_URL  = 'https://script.google.com/macros/s/AKfycbwFYH8hEzQpWOPcdK7gmwbaARn0Xe8_lTnExg8B0Af_b0e60xZ4uu-dd11sfyT6y24VTA/exec';

let state = loadState();
let timerInterval  = null;
let currentFilter  = 'day';   // widget filter
let minimized      = false;
let warnedKey      = null;    // so the 5-minute warning fires once per session
let overlayState   = null;    // {mode, projId, resume} while the time block prompt is open
let audioCtx       = null;
let soundOn        = localStorage.getItem('ws_tracker_sound') !== 'off';
const $ = id => document.getElementById(id);

function defaultState() {
  return { projects: [], activeProjectId: null, activeStart: null, activeEntryId: null, plan: [] };
}
function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); return normalizeState(r ? JSON.parse(r) : defaultState()); }
  catch { return defaultState(); }
}
function normalizeState(st) {
  if (!st || typeof st !== 'object') return defaultState();
  if (!Array.isArray(st.projects)) st.projects = [];
  if (!Array.isArray(st.plan)) st.plan = [];
  if (!('activeEntryId' in st)) st.activeEntryId = null;
  return st;
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid() { return Math.random().toString(36).slice(2,10); }


// ══ TIMER ══
function toggleTimer() {
  if (state.activeProjectId) stopTimer();
  else showToast('Click a project to start tracking');
}

function startTimer(id, entryId) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  ensureAudio();
  const ent = entryId ? entryById(entryId) : null;
  // A used-up block can't just be started again — extend it on purpose first
  if (proj.allocatedSeconds && projRemaining(proj) <= 0) { openBlockOverlay('timeup', id, true, ent ? ent.id : null); return; }
  if (ent && entryRemaining(ent) <= 0) { showToast('That planned block is already complete'); return; }
  if (state.activeProjectId) stopTimer();
  state.activeProjectId = id;
  state.activeEntryId = ent ? ent.id : null;
  state.activeStart = Date.now();
  warnedKey = null;
  saveState();
  renderProjects(); renderTimerBar(); refreshPlanUI();
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  startPulse();
  checkBudget();   // warn straight away if the block is already nearly used up
}

// opts.capSeconds: never log more than this for the session (used when a block runs out,
// so time spent away from the page is not counted past the limit)
function stopTimer(opts) {
  if (!state.activeProjectId) return;
  const proj = state.projects.find(p => p.id === state.activeProjectId);
  if (proj && state.activeStart) {
    let elapsed = Math.floor((Date.now() - state.activeStart) / 1000);
    let end = Date.now();
    if (opts && opts.capSeconds != null && elapsed > opts.capSeconds) {
      elapsed = Math.max(0, opts.capSeconds);
      end = state.activeStart + elapsed * 1000;
    }
    if (elapsed > 0) {
      const sess = { start: state.activeStart, end, seconds: elapsed };
      if (state.activeEntryId) sess.entryId = state.activeEntryId;   // which planned block it counted against
      proj.sessions.push(sess);
    }
  }
  state.activeProjectId = null;
  state.activeEntryId = null;
  state.activeStart = null;
  warnedKey = null;
  saveState();
  clearInterval(timerInterval);
  renderTimerBar(); renderProjects(); renderSummary(); refreshPlanUI();
  stopPulse();
}

function tickTimer() {
  if (!state.activeProjectId) return;
  paintTimer();
  paintActiveRow();
  renderSummary();
  checkBudget();   // last: it can stop the timer
}


// ══ FORMAT HELPERS ══
function formatMM(sec) {
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function formatHM(sec) { return `${Math.floor(sec/3600)}h ${pad(Math.floor((sec%3600)/60))}m`; }
function formatHMdec(sec) { return (sec/3600).toFixed(2) + 'h'; }
function pad(n) { return String(n).padStart(2,'0'); }

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
}


// ══ FILTER HELPERS ══
function sessionInFilter(sess, filter) {
  const d = new Date(sess.start), now = new Date();
  if (filter === 'day')   return d.toDateString() === now.toDateString();
  if (filter === 'week')  { const w = new Date(); w.setDate(now.getDate()-7); return d >= w; }
  if (filter === 'month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  if (filter === 'year')  return d.getFullYear()===now.getFullYear();
  return false;
}

function sessionInWidgetFilter(sess) { return sessionInFilter(sess, currentFilter); }

function projectSecondsInFilter(proj) {
  let total = proj.sessions.filter(sessionInWidgetFilter).reduce((a,s)=>a+s.seconds,0);
  if (proj.id===state.activeProjectId && state.activeStart)
    total += Math.floor((Date.now()-state.activeStart)/1000);
  return total;
}


// ══ TIME BLOCKS ══
// Every project carries allocatedSeconds: the total time you agreed to spend on it.
// Projects saved before this feature have none and show "Set time block".
const BLOCK_OPTIONS_MIN = (() => {
  const a = [];
  for (let m = 15; m <= 240; m += 15) a.push(m);    // 15 min steps up to 4 h
  for (let m = 270; m <= 480; m += 30) a.push(m);   // then 30 min steps up to 8 h
  return a;
})();

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtLeft(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return m ? `${h}h ${m}m` : `${h}h`;
  if (m >= 10) return `${m}m`;
  if (m > 0) return `${m}m ${pad(s)}s`;
  return `${s}s`;
}

function projLogged(proj)   { return proj.sessions.reduce((a, s) => a + s.seconds, 0); }
function activeElapsed()    { return state.activeStart ? Math.floor((Date.now() - state.activeStart) / 1000) : 0; }
function projUsed(proj)     { return projLogged(proj) + (proj.id === state.activeProjectId ? activeElapsed() : 0); }
function projRemaining(proj){ return proj.allocatedSeconds ? proj.allocatedSeconds - projUsed(proj) : null; }
// Warn at 5 minutes left (or a quarter of the block, whichever is smaller)
function warnThreshold(alloc) { return Math.min(300, Math.floor(alloc * 0.25)); }

function fillBlockSelect() {
  $('newProjectMinutes').innerHTML = '<option value="" disabled selected>⏳ Time…</option>' +
    BLOCK_OPTIONS_MIN.map(m => `<option value="${m}">${fmtLeft(m*60)}</option>`).join('');
}

// ── Planned blocks (Day Plan entries) ──
function entryById(id)  { return (state.plan || []).find(e => e.id === id) || null; }
function projOf(e)      { return state.projects.find(p => p.id === e.projectId) || null; }
function entryLogged(e) {
  let t = 0;
  state.projects.forEach(p => p.sessions.forEach(x => { if (x.entryId === e.id) t += x.seconds; }));
  return t;
}
function entryUsed(e)      { return entryLogged(e) + (state.activeEntryId === e.id ? activeElapsed() : 0); }
function entryRemaining(e) { return e.durMin * 60 - entryUsed(e); }

// What is limiting the running timer right now: the planned block or the project's total time block,
// whichever runs out first. Returns null when neither applies (count-up).
function activeLimit() {
  const proj = state.projects.find(p => p.id === state.activeProjectId);
  if (!proj || !state.activeStart) return null;
  const budget = proj.allocatedSeconds ? projRemaining(proj) : null;
  const ent = state.activeEntryId ? entryById(state.activeEntryId) : null;
  const slot = ent ? entryRemaining(ent) : null;
  if (budget === null && slot === null) return null;
  if (slot !== null && (budget === null || slot <= budget)) return { rem: slot, total: ent.durMin * 60, kind: 'slot', ent, proj };
  return { rem: budget, total: proj.allocatedSeconds, kind: 'budget', ent, proj };
}

// Called every second while a timer runs (and once on load)
function checkBudget() {
  if (!state.activeProjectId || !state.activeStart) return;
  const lim = activeLimit();
  if (!lim) return;
  if (lim.rem <= 0) { handleTimeUp(lim); return; }
  const key = lim.proj.id + ':' + state.activeStart;
  if (lim.rem <= warnThreshold(lim.total) && warnedKey !== key) {
    warnedKey = key;
    beep(2);
    showToast(`⚠️ ${fmtLeft(lim.rem)} left on ${lim.proj.name}`);
  }
}

function handleTimeUp(lim) {
  const proj = lim.proj, ent = lim.ent;
  const allowedBudget = proj.allocatedSeconds ? proj.allocatedSeconds - projLogged(proj) : Infinity;
  const allowedSlot   = ent ? ent.durMin * 60 - entryLogged(ent) : Infinity;
  const entId = ent ? ent.id : null;
  stopTimer({ capSeconds: Math.max(0, Math.min(allowedBudget, allowedSlot)) });
  beep(3);
  openBlockOverlay(lim.kind === 'slot' ? 'slotdone' : 'timeup', proj.id, true, entId);
}

function blockChoices(usedSec, currentMin) {
  let v = BLOCK_OPTIONS_MIN.filter(m => m * 60 > usedSec);
  if (!v.length) { const base = Math.ceil(usedSec / 900) * 15; v = [base + 15, base + 30, base + 45, base + 60]; }
  if (currentMin && !v.includes(currentMin)) { v.push(currentMin); v.sort((a, b) => a - b); }
  return v;
}

function openBlockOverlay(mode, projId, resume, entryId) {
  const proj = state.projects.find(p => p.id === projId);
  if (!proj) return;
  if (minimized) toggleMinimize();            // make sure the prompt can actually be seen
  overlayState = { mode, projId, resume: !!resume, entryId: entryId || null, nextId: null };
  const emoji = $('blockEmoji'), title = $('blockTitle'), text = $('blockText'), body = $('blockBody');

  if (mode === 'timeup') {
    emoji.textContent = '⏰';
    title.textContent = "Time's up";
    text.innerHTML = `You've used all <b>${fmtLeft(proj.allocatedSeconds)}</b> you set aside for <b>${esc(proj.name)}</b>.<br>` +
      (resume ? 'Extend it on purpose to keep going, or call it done.' : 'Extend the block, or leave it as it is.');
    body.innerHTML = `
      <div class="block-actions">
        <button class="block-btn" onclick="extendBlock(15)">+15 min</button>
        <button class="block-btn" onclick="extendBlock(30)">+30 min</button>
        <button class="block-btn" onclick="extendBlock(45)">+45 min</button>
      </div>
      <button class="block-btn ghost" onclick="closeBlockOverlay()">I'm done for now</button>`;
  } else if (mode === 'slotdone') {
    const ent = entryById(entryId), nx = ent ? nextAfter(ent) : null;
    overlayState.nextId = nx ? nx.id : null;
    const nxProj = nx ? projOf(nx) : null;
    emoji.textContent = '✅';
    title.textContent = 'Block complete';
    text.innerHTML = `Your planned block for <b>${esc(proj.name)}</b> is finished.<br>` +
      (nx ? `Up next: <b>${nxProj.icon} ${esc(nxProj.name)}</b> · ${fmtClock(nx.startMin)} · ${fmtLeft(nx.durMin * 60)}`
          : "That was the last block planned for today. Add more time or call it done.");
    body.innerHTML = nx ? `
      <div class="block-actions">
        <button class="block-btn" onclick="slotDoneStartNext()">▶ Start next</button>
        <button class="block-btn ghost" onclick="extendEntryFromOverlay(15)">+15 min</button>
      </div>
      <button class="block-btn ghost" onclick="closeBlockOverlay()">I'm done for now</button>` : `
      <div class="block-actions">
        <button class="block-btn" onclick="extendEntryFromOverlay(15)">+15 min</button>
        <button class="block-btn" onclick="extendEntryFromOverlay(30)">+30 min</button>
      </div>
      <button class="block-btn ghost" onclick="closeBlockOverlay()">I'm done for now</button>`;
  } else {
    const used = projUsed(proj), cur = proj.allocatedSeconds ? proj.allocatedSeconds / 60 : null;
    emoji.textContent = '⏳';
    title.textContent = cur ? 'Time block' : 'Set a time block';
    text.innerHTML = cur
      ? `<b>${esc(proj.name)}</b><br>${used > 0 ? fmtLeft(used) + ' used of ' + fmtLeft(proj.allocatedSeconds) : 'Nothing logged yet'}`
      : `How much time do you agree to spend on <b>${esc(proj.name)}</b>?`;
    body.innerHTML = `
      <select class="block-select" id="blockSelect">
        ${cur ? '' : '<option value="" disabled selected>Choose time…</option>'}
        ${blockChoices(used, cur).map(m => `<option value="${m}" ${m === cur ? 'selected' : ''}>${fmtLeft(m*60)}</option>`).join('')}
      </select>
      <div class="block-actions">
        <button class="block-btn" onclick="saveBlock()">Save</button>
        <button class="block-btn ghost" onclick="closeBlockOverlay()">Cancel</button>
      </div>`;
  }
  $('blockOverlay').classList.add('show');
  const first = body.querySelector('button, select');
  if (first) first.focus();
}

function closeBlockOverlay() {
  $('blockOverlay').classList.remove('show');
  overlayState = null;
}

function extendBlock(min) {
  if (!overlayState) return;
  const { projId, resume, entryId } = overlayState;
  const proj = state.projects.find(p => p.id === projId);
  if (!proj) return;
  proj.allocatedSeconds = (proj.allocatedSeconds || 0) + min * 60;
  saveState();
  closeBlockOverlay();
  ensureAudio();
  showToast(`+${min} min added to ${proj.name}`);
  if (resume) { const ent = entryById(entryId); startTimer(projId, ent && entryRemaining(ent) > 0 ? ent.id : null); } else renderProjects();
}

function saveBlock() {
  if (!overlayState) return;
  const min = parseInt($('blockSelect').value, 10);
  if (!min) { showToast('Choose a time block first'); return; }
  const proj = state.projects.find(p => p.id === overlayState.projId);
  if (!proj) return;
  proj.allocatedSeconds = min * 60;
  saveState();
  closeBlockOverlay();
  renderProjects(); paintTimer();
  showToast(`Time block set: ${fmtLeft(min * 60)}`);
}

// ── Alert sound (short beeps; can be muted with the bell button) ──
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function beep(count) {
  if (!soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  for (let i = 0; i < count; i++) {
    const t = audioCtx.currentTime + i * 0.3;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.25);
  }
}
function paintSoundBtn() {
  const b = $('soundBtn');
  b.textContent = soundOn ? '🔔' : '🔕';
  b.title = soundOn ? 'Alert sound on (click to mute)' : 'Alert sound off (click to unmute)';
}
function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('ws_tracker_sound', soundOn ? 'on' : 'off');
  paintSoundBtn();
  if (soundOn) beep(1);
  showToast(soundOn ? 'Alert sound on' : 'Alert sound off');
}


// ══ WIDGET RENDER ══
function renderTimerBar() {
  const bar=$('timerBar'), nameEl=$('timerProjectName');
  const dispEl=$('timerDisplay'), btn=$('playStopBtn');
  const icon=$('timerIcon');
  if (state.activeProjectId) {
    const proj=state.projects.find(p=>p.id===state.activeProjectId);
    bar.classList.remove('idle'); nameEl.classList.remove('idle-text');
    nameEl.textContent=proj?proj.name:'Unknown'; icon.textContent=proj?proj.icon:'▶';
    dispEl.textContent=formatMM(activeElapsed());
    dispEl.classList.remove('idle'); btn.classList.add('running'); btn.textContent='■';
  } else {
    bar.classList.add('idle'); nameEl.classList.add('idle-text');
    nameEl.textContent='No active timer'; icon.textContent='⏸';
    dispEl.textContent='00:00'; dispEl.classList.add('idle');
    btn.classList.remove('running'); btn.textContent='▶';
  }
  paintTimer();
}

// Countdown (or count-up when nothing limits it), warning colours, header pill
function paintTimer() {
  const bar=$('timerBar'), disp=$('timerDisplay'), sub=$('timerSub'), fill=$('budgetFill'), pill=$('headerCountdown');
  const proj = state.projects.find(p => p.id === state.activeProjectId);
  const hidePill = () => { pill.className = 'header-countdown'; pill.textContent = ''; };
  if (!proj || !state.activeStart) { sub.textContent = ''; bar.classList.remove('warn', 'has-block'); hidePill(); return; }
  const lim = activeLimit();
  if (!lim) {
    disp.textContent = formatMM(activeElapsed());
    sub.textContent = 'No time block set';
    bar.classList.remove('warn', 'has-block'); hidePill();
    return;
  }
  const rem = lim.rem;
  const warn = rem <= warnThreshold(lim.total);
  disp.textContent = formatMM(Math.max(0, rem));
  sub.textContent = warn ? `⚠ Wrapping up — ${fmtLeft(rem)} left`
    : (lim.kind === 'slot' ? `left in planned block (${fmtLeft(lim.total)})` : `left of ${fmtLeft(lim.total)} block`);
  bar.classList.toggle('warn', warn); bar.classList.add('has-block');
  fill.style.width = Math.min(100, Math.max(0, (lim.total - rem) / lim.total * 100)) + '%';
  pill.textContent = formatMM(Math.max(0, rem));
  pill.className = 'header-countdown show' + (warn ? ' warn' : '');
}

// Fills one project row: time in the current filter, time-block chip, progress bar
function paintRow(row, proj) {
  const secs = projectSecondsInFilter(proj);
  row.querySelector('.project-time').textContent = secs > 0 ? formatMM(secs) : '';
  const chip = row.querySelector('.block-chip'), fill = row.querySelector('.row-bar-fill');
  const rem = projRemaining(proj);
  let st;
  if (rem === null) {
    st = 'unset'; chip.textContent = '＋ Set time block';
  } else if (rem <= 0) {
    st = 'over'; chip.textContent = "⏰ Time's up · extend";
    fill.style.width = '100%';
  } else {
    st = rem <= warnThreshold(proj.allocatedSeconds) ? 'low' : 'ok';
    chip.textContent = `⏳ ${fmtLeft(rem)} left of ${fmtLeft(proj.allocatedSeconds)}`;
    fill.style.width = Math.min(100, projUsed(proj) / proj.allocatedSeconds * 100) + '%';
  }
  chip.className = 'block-chip ' + st;
  row.dataset.state = st;
}

function paintActiveRow() {
  const row = document.querySelector(`.project-item[data-id="${state.activeProjectId}"]`);

function renderSummary() {

function addProject() {

// ══ DAY PLAN ══
// state.plan = [{id, projectId, day:'YYYY-MM-DD', startMin (minutes after midnight), durMin}]
const PLAN_START_H = 5, PLAN_END_H = 22;          // timeline runs 5 AM – 10 PM
const HOUR_PX = 64, SNAP = 15, TOP_PAD = 10;
const PX_MIN = HOUR_PX / 60;
const DAY_MIN_START = PLAN_START_H * 60, DAY_MIN_END = PLAN_END_H * 60;
const PLAN_COLORS = [['#16a34a','#dcfce7'],['#2563eb','#dbeafe'],['#d97706','#fef3c7'],['#7c3aed','#ede9fe'],['#db2777','#fce7f3'],['#0d9488','#ccfbf1']];
let view = 'projects';
let planDay = dayKey(new Date());
let dragInfo = null;          // truthy while a drag is in progress (pauses re-rendering)
const notified = {};          // start-time reminders already shown

function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayKey() { return dayKey(new Date()); }
function parseDay(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function shiftDay(k, n) { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); }
function nowMin() { const n = new Date(); return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60; }
function fmtClock(min) {
  const h = Math.floor(min / 60) % 24, m = Math.floor(min % 60);
  return `${h % 12 || 12}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`;
}
function projColor(id) {
  let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PLAN_COLORS[h % PLAN_COLORS.length];
}
function yOf(min) { return TOP_PAD + (min - DAY_MIN_START) * PX_MIN; }
function minuteAtY(clientY) {
  const r = $('planGrid').getBoundingClientRect();
  return DAY_MIN_START + (clientY - r.top - TOP_PAD) / PX_MIN;
}
function dayEntries(day) { return state.plan.filter(e => e.day === day).sort((a, b) => a.startMin - b.startMin); }

// ── Placement rules: stay inside the day, never overlap another block ──
function isFree(day, start, dur, ignoreId) {
  if (start < DAY_MIN_START || start + dur > DAY_MIN_END) return false;
  return !state.plan.some(e => e.day === day && e.id !== ignoreId && start < e.startMin + e.durMin && e.startMin < start + dur);
}
// Nearest free start to `want` (searching both ways unless fwd = only later times)
function findSlot(day, want, dur, ignoreId, fwd) {
  want = Math.max(DAY_MIN_START, Math.min(want, DAY_MIN_END - dur));
  const steps = (DAY_MIN_END - DAY_MIN_START) / SNAP;
  for (let i = 0; i <= steps; i++) {
    const o = i * SNAP;
    if (isFree(day, want + o, dur, ignoreId)) return want + o;
    if (!fwd && i > 0 && isFree(day, want - o, dur, ignoreId)) return want - o;
  }
  return null;
}
// Same, but shrinks the block if the day has no gap big enough
function placeEntry(day, want, dur, fwd) {
  for (let d = dur; d >= SNAP; d -= SNAP) {
    const st = findSlot(day, want, d, null, fwd);
    if (st !== null) return { start: st, dur: d };
  }
  return null;
}

// New blocks default to what is still unplanned in the project's time block
function defaultEntryMin(proj) {
  const rem = projRemaining(proj);
  if (rem === null) return 30;
  const planned = state.plan.filter(e => e.projectId === proj.id).reduce((a, e) => a + Math.max(0, entryRemaining(e)), 0);
  const left = rem - planned;
  if (left <= 0) return 15;
  return Math.max(15, Math.min(240, Math.ceil(left / 900) * 15));
}

function commitEntry(projId, day, start, dur) {
  const proj = state.projects.find(p => p.id === projId);
  if (!proj) return;
  const e = { id: uid(), projectId: projId, day, startMin: start, durMin: dur };
  state.plan.push(e);
  if (day === todayKey() && start <= nowMin()) notified[e.id] = true;
  saveState(); refreshPlanUI();
  showToast(`Planned ${proj.name} · ${fmtClock(start)} · ${fmtLeft(dur * 60)}`);
}
function addAuto(projId) {
  const proj = state.projects.find(p => p.id === projId);
  if (!proj) return;
  const want = planDay === todayKey() ? Math.max(DAY_MIN_START, Math.ceil(nowMin() / SNAP) * SNAP) : 9 * 60;
  const p = placeEntry(planDay, want, defaultEntryMin(proj), true);
  if (!p) { showToast('No room left on this day'); return; }
  commitEntry(projId, planDay, p.start, p.dur);
}
function removePlanEntry(id) {
  if (state.activeEntryId === id) stopTimer();
  state.plan = state.plan.filter(e => e.id !== id);
  saveState(); refreshPlanUI();
}
function startEntry(id) {
  const e = entryById(id);
  if (!e || !projOf(e)) return;
  startTimer(e.projectId, e.id);
}
function nextAfter(ent) {
  return dayEntries(ent.day).find(e => e.id !== ent.id && e.startMin >= ent.startMin && entryRemaining(e) > 0 && projOf(e)) || null;
}
function nextUp() {
  const nm = nowMin();
  return dayEntries(todayKey()).find(e => state.activeEntryId !== e.id && entryRemaining(e) > 0 && e.startMin + e.durMin > nm && projOf(e)) || null;
}

// +minutes on a planned block; later blocks slide down to make room
function extendEntry(ent, min) {
  const end = ent.startMin + ent.durMin + min;
  let cursor = end;
  const moves = [];
  if (end > DAY_MIN_END) { showToast('No room left today to extend this block'); return false; }
  for (const x of dayEntries(ent.day)) {
    if (x.id === ent.id || x.startMin < ent.startMin) continue;
    if (x.startMin >= cursor) break;
    moves.push([x, cursor]);
    cursor += x.durMin;
  }
  if (cursor > DAY_MIN_END) { showToast('No room left today to shift later blocks'); return false; }
  moves.forEach(([x, st]) => { x.startMin = st; });
  ent.durMin += min;
  // the project's overall time block has to cover the longer planned block too
  const proj = projOf(ent);
  if (proj && proj.allocatedSeconds) {
    const budgetLeft = proj.allocatedSeconds - projLogged(proj);
    const entLeft = ent.durMin * 60 - entryLogged(ent);
    if (budgetLeft < entLeft) proj.allocatedSeconds += entLeft - budgetLeft;
  }
  saveState(); refreshPlanUI();
  return true;
}
function extendEntryFromOverlay(min) {
  if (!overlayState) return;
  const ent = entryById(overlayState.entryId);
  if (!ent) { closeBlockOverlay(); return; }
  if (!extendEntry(ent, min)) return;
  closeBlockOverlay();
  showToast(`+${min} min added to this block`);
  startTimer(ent.projectId, ent.id);
}
function slotDoneStartNext() {
  if (!overlayState) return;
  const id = overlayState.nextId;
  closeBlockOverlay();
  if (id) startEntry(id);
}

// ── Rendering ──
function fmtHour(h) { return `${h % 12 || 12} ${h >= 12 && h < 24 ? 'PM' : 'AM'}`; }
function buildPlanBg() {
  let h = '';
  for (let hr = PLAN_START_H; hr <= PLAN_END_H; hr++) {
    const y = yOf(hr * 60);
    h += `<div class="plan-hline" style="top:${y}px"></div><div class="plan-hlabel" style="top:${y}px">${fmtHour(hr)}</div>`;
    if (hr < PLAN_END_H) h += `<div class="plan-half" style="top:${y + HOUR_PX / 2}px"></div>`;
  }
  $('planBg').innerHTML = h;
  $('planGrid').style.height = (yOf(DAY_MIN_END) + TOP_PAD) + 'px';
}

function refreshPlanUI() {
  paintNextStrip();
  if (view === 'plan' && !dragInfo) renderPlan();
}

function renderPlan() {
  if (dragInfo) return;
  const day = planDay;
  $('planDateLabel').textContent = parseDay(day).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

  const tray = $('planTray');
  tray.innerHTML = '';
  if (!state.projects.length) tray.innerHTML = '<div class="plan-empty">Add a project on the Projects tab, then drag it onto the day.</div>';
  state.projects.forEach(p => {
    const rem = projRemaining(p), c = projColor(p.id);
    const chip = document.createElement('div');
    chip.className = 'plan-chip';
    chip.style.setProperty('--c', c[0]);
    chip.title = 'Drag onto the day, or tap to add at the next free time';
    chip.innerHTML = `<span>${p.icon}</span><span class="pc-name">${esc(p.name)}</span><span class="pc-left">${rem === null ? '' : (rem > 0 ? fmtLeft(rem) : '0m')}</span>`;
    chip.addEventListener('pointerdown', ev => trayPointerDown(ev, p.id));
    tray.appendChild(chip);
  });

  const box = $('planEntries');
  box.innerHTML = '<div class="plan-preview" id="planPreview"></div>';
  const list = dayEntries(day).filter(projOf);
  list.forEach(e => box.appendChild(buildEntry(e)));
  const total = list.reduce((a, e) => a + e.durMin, 0);
  $('planTotal').textContent = total ? `Planned ${fmtLeft(total * 60)}` : '';
  paintPlanLive();
}

function buildEntry(e) {
  const proj = projOf(e), c = projColor(proj.id);
  const done = entryRemaining(e) <= 0, active = state.activeEntryId === e.id;
  const el = document.createElement('div');
  el.className = 'plan-entry' + (done ? ' done' : '') + (active ? ' active' : '') + (e.durMin <= 15 ? ' tiny' : '');
  el.dataset.id = e.id;
  el.style.setProperty('--c', c[0]); el.style.setProperty('--bg', c[1]);
  el.style.top = yOf(e.startMin) + 'px';
  el.style.height = (e.durMin * PX_MIN - 2) + 'px';
  el.innerHTML = `
    <div class="pe-main"><span class="pe-name">${proj.icon} ${esc(proj.name)}</span><span class="pe-time"></span></div>
    <div class="pe-actions">
      ${done ? '<span class="pe-check" title="Complete">✓</span>'
             : `<button class="pe-btn pe-start" title="${active ? 'Stop' : 'Start this block'}">${active ? '■' : '▶'}</button>`}
      <button class="pe-btn pe-del" title="Remove from plan">✕</button>
    </div>
    <div class="pe-handle" title="Drag to resize"></div>`;
  paintEntryTime(el, e);
  const st = el.querySelector('.pe-start');
  if (st) st.addEventListener('click', ev => { ev.stopPropagation(); active ? stopTimer() : startEntry(e.id); });
  el.querySelector('.pe-del').addEventListener('click', ev => { ev.stopPropagation(); removePlanEntry(e.id); });
  el.addEventListener('pointerdown', ev => entryPointerDown(ev, e, el));
  return el;
}

function paintEntryTime(el, e) {
  const t = el.querySelector('.pe-time');
  if (!t) return;
  if (state.activeEntryId === e.id) t.textContent = '⏱ ' + formatMM(Math.max(0, entryRemaining(e))) + ' left';
  else if (entryRemaining(e) <= 0) t.textContent = 'Done · ' + fmtLeft(e.durMin * 60);
  else t.textContent = `${fmtClock(e.startMin)} – ${fmtClock(e.startMin + e.durMin)}`;
}

// Cheap once-a-second repaint: now-line and the running block's countdown
function paintPlanLive() {
  const now = $('planNow'), nm = nowMin();
  if (planDay === todayKey() && nm >= DAY_MIN_START && nm <= DAY_MIN_END) {
    now.style.display = 'block';
    now.style.top = yOf(nm) + 'px';
    now.querySelector('.now-pill').textContent = fmtClock(Math.floor(nm));
  } else now.style.display = 'none';
  if (dragInfo) return;
  document.querySelectorAll('.plan-entry').forEach(el => { const e = entryById(el.dataset.id); if (e) paintEntryTime(el, e); });
}

function paintNextStrip() {
  const el = $('nextStrip'), e = nextUp();
  if (!e) { el.className = 'next-strip'; return; }
  const proj = projOf(e), nm = nowMin(), due = e.startMin <= nm;
  const when = due ? `Due now (${fmtClock(e.startMin)})`
    : `Up next · ${fmtClock(e.startMin)}` + (e.startMin - nm < 60 ? ` (in ${Math.ceil(e.startMin - nm)}m)` : '');
  el.className = 'next-strip show' + (due ? ' due' : '');
  $('nextText').innerHTML = `<b>${when}</b> — ${proj.icon} ${esc(proj.name)} · ${fmtLeft(e.durMin * 60)}`;
  $('nextGo').dataset.id = e.id;
}

// Runs every second: keeps the strip/now-line fresh and reminds you when a planned block is due
function planClock() {
  paintNextStrip();
  if (view === 'plan') paintPlanLive();
  const nm = nowMin();
  dayEntries(todayKey()).forEach(e => {
    const proj = projOf(e);
    if (!proj || notified[e.id] || state.activeEntryId === e.id || entryRemaining(e) <= 0) return;
    if (nm >= e.startMin && nm < e.startMin + 2) {
      notified[e.id] = true;
      if (minimized && !state.activeProjectId) toggleMinimize();
      beep(2);
      showToast(`⏰ Time to start ${proj.name}`);
    }
  });
}

function pruneOldPlan() {
  const cutoff = shiftDay(todayKey(), -14), before = state.plan.length;
  state.plan = state.plan.filter(e => e.day >= cutoff);
  if (state.plan.length !== before) saveState();
}

// ── Navigation ──
function scrollPlanDefault() {
  const sc = $('planScroll');
  let target;
  if (planDay === todayKey()) target = Math.max(DAY_MIN_START, nowMin());
  else { const f = dayEntries(planDay)[0]; target = f ? f.startMin : 8 * 60; }
  sc.scrollTop = Math.max(0, yOf(target) - 90);
}
function setView(v) {
  view = v;
  $('viewProjects').style.display = v === 'projects' ? '' : 'none';
  $('viewPlan').style.display = v === 'plan' ? '' : 'none';
  $('vtabProjects').classList.toggle('active', v === 'projects');
  $('vtabPlan').classList.toggle('active', v === 'plan');
  if (v === 'plan') { renderPlan(); scrollPlanDefault(); }
}
function planShift(n) { planDay = shiftDay(planDay, n); renderPlan(); scrollPlanDefault(); }
function planGoToday() { planDay = todayKey(); renderPlan(); scrollPlanDefault(); }

// ── Dragging (pointer events: works with mouse, pen and touch) ──
function beginDrag(ev, h) {
  const sx = ev.clientX, sy = ev.clientY;
  let lx = sx, ly = sy, on = false, raf = 0;
  const loop = () => {
    const sc = $('planScroll'), r = sc.getBoundingClientRect();
    if (lx >= r.left && lx <= r.right) {
      if (ly < r.top + 28 && ly > r.top - 60) sc.scrollTop -= 7;
      else if (ly > r.bottom - 28 && ly < r.bottom + 60) sc.scrollTop += 7;
    }
    h.move(lx, ly);
    raf = requestAnimationFrame(loop);
  };
  const move = e => {
    lx = e.clientX; ly = e.clientY;
    if (!on) {
      if (Math.hypot(lx - sx, ly - sy) < 5) return;
      on = true; dragInfo = { }; document.body.classList.add('dragging');
      if (h.start) h.start();
      raf = requestAnimationFrame(loop);
    }
    h.move(lx, ly);
  };
  const up = e => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    cancelAnimationFrame(raf);
    document.body.classList.remove('dragging');
    const was = on;
    dragInfo = null;
    if (was) h.end(lx, ly, e.type === 'pointercancel');
    else if (h.click) h.click();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

function trayPointerDown(ev, projId) {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  const proj = state.projects.find(p => p.id === projId);
  if (!proj) return;
  ev.preventDefault();
  const dur = defaultEntryMin(proj);
  let ghost = null, drop = null, overGrid = false;
  beginDrag(ev, {
    click() { addAuto(projId); },
    start() {
      ghost = document.createElement('div');
      ghost.className = 'plan-ghost';
      ghost.textContent = `${proj.icon} ${proj.name} · ${fmtLeft(dur * 60)}`;
      document.body.appendChild(ghost);
    },
    move(x, y) {
      ghost.style.left = (x + 12) + 'px'; ghost.style.top = (y + 12) + 'px';
      const r = $('planScroll').getBoundingClientRect(), pv = $('planPreview');
      overGrid = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      drop = overGrid ? placeEntry(planDay, Math.floor(minuteAtY(y) / SNAP) * SNAP, dur, false) : null;
      if (drop) { pv.style.display = 'block'; pv.style.top = yOf(drop.start) + 'px'; pv.style.height = (drop.dur * PX_MIN - 2) + 'px'; }
      else pv.style.display = 'none';
    },
    end(x, y, cancelled) {
      if (ghost) ghost.remove();
      const pv = $('planPreview'); if (pv) pv.style.display = 'none';
      if (cancelled) return;
      if (drop) commitEntry(projId, planDay, drop.start, drop.dur);
      else if (overGrid) showToast('No room left on this day');
    }
  });
}

function entryPointerDown(ev, e, el) {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  if (ev.target.closest('.pe-btn')) return;
  ev.preventDefault();
  const sy = ev.clientY;
  if (ev.target.closest('.pe-handle')) {
    // resize: bottom edge, 15-minute steps, can't shrink below time already used, can't hit the next block
    const orig = e.durMin, minD = Math.min(orig, Math.max(SNAP, Math.ceil(entryUsed(e) / 60 / SNAP) * SNAP));
    let cur = orig;
    beginDrag(ev, {
      start() { el.classList.add('dragging'); },
      move(x, y) {
        let d = Math.max(minD, orig + Math.round((y - sy) / PX_MIN / SNAP) * SNAP);
        while (d > minD && !isFree(e.day, e.startMin, d, e.id)) d -= SNAP;
        cur = d;
        el.style.height = (cur * PX_MIN - 2) + 'px';
      },
      end(x, y, cancelled) {
        el.classList.remove('dragging');
        if (!cancelled && cur !== orig) { e.durMin = cur; saveState(); }
        refreshPlanUI();
      }
    });
  } else {
    // move: snaps to 15 minutes and to the nearest free gap
    let grab = 0, cur = e.startMin;
    beginDrag(ev, {
      start() { grab = minuteAtY(sy) - e.startMin; el.classList.add('dragging'); },
      move(x, y) {
        const want = Math.round((minuteAtY(y) - grab) / SNAP) * SNAP;
        const st = findSlot(e.day, want, e.durMin, e.id);
        if (st !== null) cur = st;
        el.style.top = yOf(cur) + 'px';
        const t = el.querySelector('.pe-time');
        if (t && state.activeEntryId !== e.id) t.textContent = `${fmtClock(cur)} – ${fmtClock(cur + e.durMin)}`;
      },
      end(x, y, cancelled) {
        el.classList.remove('dragging');
        if (!cancelled && cur !== e.startMin) { e.startMin = cur; delete notified[e.id]; saveState(); }
        refreshPlanUI();
      }
    });
  }
}


// ══ MINIMIZE / COLLAPSE ══
const COLLAPSED_HEIGHT = 52;

function toggleMinimize() {
  minimized = !minimized;
  const body = document.getElementById('mainBody');
  const btn  = document.getElementById('minimizeBtn');
  if (minimized) {
    body.style.display='none';
    btn.textContent='□';
    window.parent.postMessage({type:'ws-tracker-resize', height: COLLAPSED_HEIGHT},'*');
  } else {
    body.style.display='';
    btn.textContent='─';
    requestAnimationFrame(()=>requestAnimationFrame(()=>notifyHeight()));
  }
}

function notifyHeight() {
  const h = document.getElementById('widget').scrollHeight;
  window.parent.postMessage({type:'ws-tracker-resize', height: h+24},'*');
}


// ══ PULSE ══
function startPulse() { document.getElementById('pulseDot').style.animation='pulse 1.2s ease-in-out infinite'; }
function stopPulse()  { document.getElementById('pulseDot').style.animation=''; }
const ps=document.createElement('style');
ps.textContent=`@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(22,163,74,0.4)}50%{box-shadow:0 0 12px rgba(22,163,74,0.8)}}`;
document.head.appendChild(ps);


// ══ SYNC TO SHEETS ══
function getSyncedIds() {
  try { return JSON.parse(localStorage.getItem('ws_synced_ids')||'[]'); } catch { return []; }
}
function markSynced(ids) {
  const ex=getSyncedIds();
  localStorage.setItem('ws_synced_ids', JSON.stringify([...new Set([...ex,...ids])]));
}

async function syncToSheets() {
  if (SHEETS_URL==='YOUR_APPS_SCRIPT_URL_HERE') { showToast('⚠️ Paste your Apps Script URL first'); return; }
  const btn=document.getElementById('syncBtn');
  const syncedIds=getSyncedIds(), payload=[];
  state.projects.forEach(proj => {
    proj.sessions.forEach(sess => {
      const id=sess._sheetId||`${proj.id}-${sess.start}`;
      if (!syncedIds.includes(id)) payload.push({id,project:proj.name,task:'',start:sess.start,end:sess.end,seconds:sess.seconds,notes:''});
    });
  });
  if (!payload.length) { showToast('All sessions already synced ✓'); return; }
  btn.classList.add('syncing'); btn.textContent='⟳ Syncing…';
  try {
    const res=await fetch(SHEETS_URL,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'text/plain'}});
    const json=await res.json();
    if (json.success) {
      markSynced(payload.map(p=>p.id));
      btn.classList.remove('syncing'); btn.classList.add('synced'); btn.textContent='✓ Synced!';
      showToast(`${payload.length} session${payload.length>1?'s':''} saved to Sheets`);
      setTimeout(()=>{ btn.classList.remove('synced'); btn.textContent='↑ Sync to Sheets'; },3000);
    } else throw new Error(json.error||'Unknown error');
  } catch(err) {
    btn.classList.remove('syncing'); btn.classList.add('error'); btn.textContent='✕ Failed';
    showToast('Sync failed — check console'); console.error(err);
    setTimeout(()=>{ btn.classList.remove('error'); btn.textContent='↑ Sync to Sheets'; },3000);
  }
}


// ══ TOAST ══
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}


// ══ FOOTER CLOCK ══
function updateFooterDate() {
  const now=new Date();
  const date=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const time=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
  document.getElementById('footerDate').textContent=`${date}  •  ${time}`;
}


// ══ BOOT ══

document.addEventListener('DOMContentLoaded', () => {
  fillBlockSelect();
  buildPlanBg();
  pruneOldPlan();
  paintSoundBtn();
  updateFooterDate();
  renderAll();
  if (state.activeProjectId && state.activeStart) {
    timerInterval=setInterval(tickTimer,1000); startPulse();
    checkBudget();   // the block may have run out while the page was closed
  }
  document.addEventListener('pointerdown', ensureAudio, { once: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlayState) closeBlockOverlay(); });
  setInterval(renderSummary, 5000);
  setInterval(updateFooterDate, 1000);
  setInterval(planClock, 1000);
  setTimeout(notifyHeight, 100);

  // Keep the embedding iframe the right height as projects are added/removed (not while collapsed)
  if (window.ResizeObserver) new ResizeObserver(() => { if (!minimized) notifyHeight(); }).observe($('widget'));

  // The dashboard page (or another tab) may change the saved data — pick it up live
  window.addEventListener('storage', e => {
    if (e.key !== STORAGE_KEY) return;
    state = loadState();
    clearInterval(timerInterval);
    if (state.activeProjectId && state.activeStart) { timerInterval=setInterval(tickTimer,1000); startPulse(); }
    else stopPulse();
    renderAll();
  });
});

</script>
